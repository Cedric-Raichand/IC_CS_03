<!DOCTYPE html>
<html lang="en">
<head>
    <title>Phishing Detection System</title>
</head>
<body>

<h1>Phishing Detection System</h1>

<form method="POST">
    <input type="text" name="url" placeholder="Enter URL here" required size="50">
    <button type="submit">Check</button>
</form>

{% if result %}
    <h2>Rule-Based Result</h2>
    <p><strong>Status:</strong> {{ result }}</p>
    <p><strong>Risk Score:</strong> {{ risk_score }}</p>

    <h3>Reasons:</h3>
    <ul>
        {% for reason in reasons %}
            <li>{{ reason }}</li>
        {% endfor %}
    </ul>
{% endif %}

{% if ml_result %}
    <h2>ML Model Prediction</h2>
    <p><strong>{{ ml_result }}</strong></p>
{% endif %}

</body>
</html>
