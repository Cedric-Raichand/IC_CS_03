<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
</head>
<body>

<h2>🔎 Phishing URL Detector</h2>

<form method="POST">
    <input type="text" name="url" placeholder="Enter website URL" required>
    <button type="submit">Check</button>
</form>

{% if result %}
<hr>
<h3>Result for: {{ result.url }}</h3>
<h2>Status: {{ result.verdict }}</h2>
<p>Risk Score: {{ result.score }}</p>

<h4>Reasons:</h4>
<ul>
    {% for r in result.reasons %}
    <li>{{ r }}</li>
    {% endfor %}
</ul>
{% endif %}

</body>
</html>
